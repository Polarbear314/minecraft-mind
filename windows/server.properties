#Minecraft Mind terrarium - Minecraft 1.21.4 dedicated server
# Only reachable from this PC (the bot, and you in your own game client).
# Offline mode lets the bot join without an account, so don't open this to the network.
server-ip=127.0.0.1
server-port=25565
online-mode=false
enforce-secure-profile=false
motd=Minecraft Mind terrarium
level-name=terrarium
level-seed=
gamemode=survival
difficulty=easy
hardcore=false
pvp=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
# 0 = the bot may break/place blocks right at spawn (the village)
spawn-protection=0
# mineflayer pathfinding sometimes looks like flying to the anti-cheat
allow-flight=true
max-players=4
view-distance=6
simulation-distance=6
enable-command-block=false
# keep the world ticking even while the bot is restarting
pause-when-empty-seconds=-1
